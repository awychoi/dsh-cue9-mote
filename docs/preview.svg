    <rect x="358" y="403" width="18" height="6" rx="2"/><rect x="380" y="403" width="18" height="6" rx="2"/><rect x="402" y="403" width="18" height="6" rx="2"/><rect x="424" y="403" width="18" height="6" rx="2" fill="#2b5a5e"/><rect x="446" y="403" width="18" height="6" rx="2"/><rect x="468" y="403" width="18" height="6" rx="2"/>
