    <path d="M73.5 229.5v2.5M77.5 229.5v2.5M73.5 241v2.5M77.5 241v2.5M68 232h2.5M68 236h2.5M80.5 232H83M80.5 236H83"/>
  </g>
  <text x="88" y="242" class="ui muted" font-size="11.5">Firmware</text>

  <g fill="none" stroke="#8b867a" stroke-width="1.2" stroke-linejoin="round">
    <path d="M70 271h6.5v-2.5a2.5 2.5 0 0 1 5 0v2.5H83v6.5h-2.5a2.5 2.5 0 0 0 0 5H83v6.5h-6.5v-2.5a2.5 2.5 0 0 0-5 0V285H70z"/>
  </g>
  <text x="88" y="282" class="ui muted" font-size="11.5">DSH plugin</text>

  <!-- Sidebar footer -->
