<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="title desc">
  <title id="title">cue9 mote in the cue9 app, dark theme</title>
  <desc id="desc">An illustrative dark-theme layout: the cue9 app's Live view with Pip previewing Frantic typing, current agents and action mapping, beside the physical cue9 mote with its round screen and two lit agent keys.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0c0a"/>
      <stop offset=".55" stop-color="#0b0b09"/>
      <stop offset="1" stop-color="#13110c"/>
    </linearGradient>
    <radialGradient id="orangeGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff6a00" stop-opacity=".16"/>
      <stop offset=".55" stop-color="#ff6a00" stop-opacity=".045"/>
      <stop offset="1" stop-color="#ff6a00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151512"/>
      <stop offset="1" stop-color="#11110e"/>
    </linearGradient>
    <radialGradient id="stage" cx=".5" cy=".46" r=".55">
      <stop offset="0" stop-color="#0b100f"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="device" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#211e18"/>
      <stop offset=".55" stop-color="#191713"/>
      <stop offset="1" stop-color="#151310"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity=".65"/>
    </filter>
    <filter id="deviceShadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity=".7"/>
    </filter>
    <filter id="keyGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#ff6a00" flood-opacity=".55"/>
    </filter>
    <filter id="greenGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#6cc79b" flood-opacity=".45"/>
    </filter>
    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .ink { fill: #f7f4ec; }
      .ink2 { fill: #ded9cd; }
      .muted { fill: #b5b0a4; }
      .soft { fill: #807b70; }
      .faint { fill: #5f5b51; }
      .orange { fill: #ff7a1a; }
      .green { fill: #6cc79b; }
      .cyan { fill: #64e0ec; }
      .card { fill: #171713; stroke: #2a2822; stroke-width: 1; }
      .rule { stroke: #26241e; stroke-width: 1; }
      .track { letter-spacing: 1.35px; }
      .label { font-size: 8.5px; font-weight: 700; letter-spacing: 1.1px; }
      .chip { fill: #1d1c17; stroke: #2d2a23; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <ellipse cx="1040" cy="330" rx="300" ry="270" fill="url(#orangeGlow)"/>
  <ellipse cx="360" cy="120" rx="340" ry="180" fill="#ffffff" opacity=".012"/>

  <!-- App window -->
  <rect x="40" y="44" width="810" height="632" rx="22" fill="url(#win)" stroke="#2c2a24" filter="url(#shadow)"/>

  <!-- Sidebar -->
  <path d="M62 44h148v632H62a22 22 0 0 1-22-22V66a22 22 0 0 1 22-22z" fill="#0f0f0d"/>
  <line x1="210" y1="44" x2="210" y2="676" class="rule"/>

  <svg x="62" y="70" width="28" height="28" viewBox="0 0 1024 1024">
    <rect width="1024" height="1024" rx="228" fill="#000"/>
    <g transform="translate(132 132) scale(1.484375)"><g transform="rotate(-32 256 256)">
      <path d="M 398.472 345.026 A 168 168 0 1 1 398.472 166.974" fill="none" stroke="#fff" stroke-width="62" stroke-linecap="round"/>
      <ellipse cx="214" cy="236" rx="25" ry="38" fill="#fff"/>
      <ellipse cx="306" cy="224" rx="28" ry="42" fill="#fff"/>
    </g></g>
    <circle cx="773.391" cy="773.391" r="34" fill="#FF6A00"/>
  </svg>
  <text x="98" y="91" class="ui ink" font-size="21" font-weight="650">cue9</text>
  <text x="62" y="118" class="ui soft track" font-size="7.5" font-weight="700">MOTE CONTROL</text>

