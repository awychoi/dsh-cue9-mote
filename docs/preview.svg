  <!-- Current state card -->
  <rect x="626" y="132" width="224" height="210" rx="14" class="card"/>
  <text x="644" y="157" class="ui soft label">CURRENT STATE</text>
  <text x="644" y="185" class="ui ink" font-size="16" font-weight="650">Running commands</text>
  <text x="644" y="200" class="ui soft" font-size="8">DSH action</text>
  <rect x="789" y="168" width="43" height="21" rx="6" fill="#2a1a0c"/>
  <text x="810" y="183" class="mono orange" font-size="8" text-anchor="middle">work</text>
  <line x1="644" y1="212" x2="832" y2="212" class="rule"/>
  <text x="644" y="244" class="ui ink" font-size="20" font-weight="600">2</text>
  <text x="644" y="259" class="ui soft track" font-size="6.5" font-weight="700">KEYS</text>
  <text x="710" y="244" class="ui ink" font-size="20" font-weight="600">3</text>
  <text x="710" y="259" class="ui soft track" font-size="6.5" font-weight="700">AGENTS</text>
