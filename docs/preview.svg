    <line x1="644" y1="430" x2="832" y2="430" class="rule"/>
    <text x="644" y="446" class="ink2">Session starts</text><text x="832" y="446" class="soft" font-size="8" text-anchor="end">Wake</text>
    <line x1="644" y1="456" x2="832" y2="456" class="rule"/>
    <text x="644" y="472" class="ink2">Thinking</text><text x="832" y="472" class="soft" font-size="8" text-anchor="end">Thinking</text>
