  <text x="256" y="157" class="ui soft label">LIVE PREVIEW</text>
  <circle cx="424" cy="306" r="138" fill="url(#stage)" stroke="#1e1c17"/>
  <circle cx="424" cy="306" r="137" fill="none" stroke="#64e0ec" stroke-opacity=".06"/>

  <!-- Pip -->
