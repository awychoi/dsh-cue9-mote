  <rect x="54" y="142" width="144" height="32" rx="9" fill="#211f1a"/>
  <rect x="56" y="150" width="3" height="16" rx="1.5" class="orange"/>
  <path d="M73 151l1.8 4.2L79 157l-4.2 1.8L73 163l-1.8-4.2L67 157l4.2-1.8z" fill="none" stroke="#ff7a1a" stroke-width="1.3" stroke-linejoin="round"/>
  <text x="88" y="163" class="ui ink" font-size="11.5" font-weight="600">Live</text>

  <g fill="none" stroke="#8b867a" stroke-width="1.2">
    <rect x="70" y="193" width="5" height="5" rx="1.2"/>
    <rect x="78" y="193" width="5" height="5" rx="1.2"/>
    <rect x="70" y="201" width="5" height="5" rx="1.2"/>
    <rect x="78" y="201" width="5" height="5" rx="1.2"/>
  </g>
  <text x="88" y="203" class="ui muted" font-size="11.5">Animations</text>
  <text x="188" y="202" class="mono soft" font-size="8" text-anchor="end">15</text>

  <g fill="none" stroke="#8b867a" stroke-width="1.2">
