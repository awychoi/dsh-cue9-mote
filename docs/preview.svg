  <rect x="54" y="562" width="144" height="34" rx="9" fill="#151512" stroke="#26241e"/>
  <text x="74" y="583" class="ui soft" font-size="8.5" text-anchor="middle">Light</text>
  <text x="113" y="583" class="ui soft" font-size="8.5" text-anchor="middle">System</text>
  <rect x="147" y="565" width="48" height="28" rx="7" fill="#26231c"/>
  <circle cx="158" cy="579" r="2.5" class="orange"/>
  <text x="172" y="582" class="ui ink2" font-size="8.5">Dark</text>

  <rect x="54" y="612" width="144" height="52" rx="9" fill="#141410" stroke="#24221c"/>
  <text x="66" y="630" class="ui muted" font-size="8" font-weight="600">USB</text>
  <circle cx="142" cy="627" r="3" class="green"/>
  <text x="150" y="630" class="ui green" font-size="8">connected</text>
  <text x="66" y="651" class="mono soft" font-size="7.5">/dev/cu.usbmodem1401</text>

  <!-- Main header -->
  <text x="238" y="94" class="ui ink" font-size="26" font-weight="650">Live</text>
  <text x="238" y="114" class="ui muted" font-size="10">The mote follows DSH. Preview an animation without interrupting the live one.</text>
  <rect x="676" y="72" width="150" height="26" rx="13" fill="#14251b" stroke="#1f3a2b"/>
  <circle cx="691" cy="85" r="3.2" class="green"/>
  <text x="701" y="89" class="ui green" font-size="9.5" font-weight="600">Following DSH</text>

  <!-- Preview card -->
